<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Outer Tech Hexagon / Gear Base -->
  <rect width="64" height="64" rx="16" fill="url(#coreGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Mechanical Gear Silhouette -->
  <g transform="translate(32,32)">
    <circle r="18" fill="none" stroke="url(#gearGrad)" stroke-width="4" stroke-dasharray="8 3"/>
    <circle r="11" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle r="5" fill="#38BDF8"/>
    <!-- Cardinal Crosshairs -->
    <line x1="-22" y1="0" x2="-14" y2="0" stroke="#38BDF8" stroke-width="2"/>
    <line x1="14" y1="0" x2="22" y2="0" stroke="#38BDF8" stroke-width="2"/>
    <line x1="0" y1="-22" x2="0" y2="-14" stroke="#38BDF8" stroke-width="2"/>
    <line x1="0" y1="14" x2="0" y2="22" stroke="#38BDF8" stroke-width="2"/>
  </g>
</svg>
